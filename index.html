    <!-- Favicon -->
    <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
         damit Light-Nutzer keinen dunklen Flash sehen. Der Settings-Store übernimmt danach. -->
    <script>
      try {
        var storedTheme =
          localStorage.getItem('theme') || localStorage.getItem('bildkonverter-theme');
        var isDark =
          storedTheme === 'dark' ||
          (storedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <link rel="icon" href="/favicon.ico" />
