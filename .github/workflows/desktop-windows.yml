name: Windows-Desktop-App

# Baut den Bildkonverter als Windows-App (Tauri): NSIS-Installer (.exe) und
# MSI-Pakete (.msi, Deutsch und Englisch). Läuft auf einem Windows-Runner,
# weil WiX (.msi) nur unter Windows baut. Der Web-Build/Deploy ist davon
# unabhängig (eigener Build-Modus, Ausgabe nach dist-desktop/).
#
# Auslöser:
#   - manuell (Actions → Windows-Desktop-App → Run workflow): Dateien als Artefakt
#   - Tag desktop-v* (z. B. desktop-v3.0.0): zusätzlich GitHub-Release mit den Dateien
#   - Pull Requests, die die Desktop-Hülle ändern: Probe-Build

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-windows.yml'
      - 'vite.config.js'
      - '.env.desktop'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Installer bauen (.exe und .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # Baut zuerst das Frontend (npm run build:desktop), dann App und Installer
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: bildkonverter-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub-Release anlegen
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bildkonverter-windows
          path: installer
      - name: Release mit Installern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/nsis/*.exe installer/msi/*.msi \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bildkonverter Pro (Windows) $GITHUB_REF_NAME" \
            --notes "Windows-Installer (.exe) und MSI-Pakete. Nicht signiert: Windows SmartScreen zeigt beim ersten Start eine Warnung (Weitere Informationen → Trotzdem ausführen)."
